name: Build APK de teste

# APK assinado com a MESMA keystore da release, pra testar uma branch no
# aparelho ANTES do merge (instala por cima da versão em prod). Roda a cada push
# em branch feat/** ou fix/** e também à mão (só funciona depois que este arquivo
# existir na main):
#   gh workflow run build-apk-teste.yml --ref <branch>
# Não cria release nem bumpa versão — o artifact some em 7 dias.
on:
  push:
    branches: ['feat/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get current version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Inject version into build.gradle
        run: |
          V="${{ steps.version.outputs.current }}"
          IFS='.' read -r MA MI PA <<< "$V"
          PA=${PA:-0}
          # Mesmo versionCode que a release desta versão terá: instala por cima
          # da versão anterior em prod e, depois, a release oficial reinstala por cima.
          CODE=$((MA * 10000 + MI * 100 + PA))
          sed -i "s/versionCode [0-9]\+/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          echo "versionCode=$CODE versionName=$V"
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/nutritrack-release.keystore

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build signed APK
        run: cd android && ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: nutritrack-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          mv "$APK" "android/app/build/outputs/apk/release/NutriTrack-v${{ steps.version.outputs.current }}-teste-${{ steps.version.outputs.sha }}.apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriTrack-teste-${{ steps.version.outputs.sha }}
          path: android/app/build/outputs/apk/release/NutriTrack-v${{ steps.version.outputs.current }}-teste-${{ steps.version.outputs.sha }}.apk
          retention-days: 7
